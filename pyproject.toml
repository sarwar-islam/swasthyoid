[project]
name = "swasthyoid"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["swasthyoid*"]

[tool.pytest.ini_options]
testpaths = ["swasthyoid/tests"]
pythonpath = ["."]
