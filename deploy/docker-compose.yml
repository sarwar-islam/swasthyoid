# SwasthyoID: postgres, api, web, nginx and the three workers. Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Synthetic data only. See docs/DEPLOYMENT.md.
x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile.api }
  restart: unless-stopped
  depends_on: { postgres: { condition: service_healthy } }
  environment: &env
    DATABASE_URL: postgresql://swasthyoid:${POSTGRES_PASSWORD:?set it in deploy/.env}@postgres:5432/swasthyoid
    DOCUMENT_STORE: /data/documents
    PII_KEY: ${PII_KEY:?}
    DOCUMENT_KEY: ${DOCUMENT_KEY:?}
    EXTRACTION_KEY: ${EXTRACTION_KEY:?}
    HMAC_KEY: ${HMAC_KEY:?}
    JWT_SECRET: ${JWT_SECRET:?}
    APP_ENV: ${APP_ENV:-production}
    DEV_LOG_CODES: ${DEV_LOG_CODES:-0}
  volumes: [documents:/data/documents]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swasthyoid
      POSTGRES_USER: swasthyoid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "swasthyoid"], interval: 5s, retries: 20 }

  api:  # applies the schema at startup; start it before the workers
    <<: *app
    environment:
      <<: *env
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, retries: 10 }

  # exit 2 means a configuration error: compose's "on-failure:5" stops retrying rather than looping forever
  worker-extract:
    <<: *app
    restart: on-failure:5
    depends_on: { api: { condition: service_healthy } }
    environment: { <<: *env, EXTRACTION_POLL_SECONDS: "10" }
    command: ["python", "-m", "swasthyoid.workers.extract"]
  worker-safety:
    <<: *app
    restart: on-failure:5
    depends_on: { api: { condition: service_healthy } }
    environment: { <<: *env, SAFETY_POLL_SECONDS: "10" }
    command: ["python", "-m", "swasthyoid.workers.safety"]
  worker-notify:
    <<: *app
    restart: on-failure:5
    depends_on: { api: { condition: service_healthy } }
    environment: { <<: *env, NOTIFY_POLL_SECONDS: "5", NOTIFY_CHANNEL: "${NOTIFY_CHANNEL:-in_app}" }
    command: ["python", "-m", "swasthyoid.workers.deliver"]

  # synthetic demo data, on request only: docker compose ... --profile demo run --rm seed (needs APP_ENV=development)
  seed:
    <<: *app
    profiles: [demo]
    restart: "no"
    depends_on: { api: { condition: service_healthy } }
    command: ["python", "-m", "swasthyoid.devtools.seed"]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params.conf:/etc/nginx/proxy_params.conf:ro

volumes:
  pgdata:
  documents:
