# Edge proxy: /api to the API, everything else to the web container. Security headers and rate limits live here.
# TLS: terminate it in front of this (the host's load balancer, or add a listen 443 ssl block with your certificates).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;   # sign-in codes: the API also limits per phone
limit_req_status 429;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 12m;  # document photos

    # The script hash pins the one inline script (web/scripts/prerender.mjs); change both together.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-GC1GPdSlMyRmy8PnlYijgoLrTky38YZMx3LorGrOITE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location /api/v1/auth/otp/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params.conf;
    }
    location / {
        proxy_pass http://web:8080;
        include /etc/nginx/proxy_params.conf;
    }
}
